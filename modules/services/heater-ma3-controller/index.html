<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>油汀温控 · NAS0</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.6 system-ui,sans-serif; }
  body { margin: 0; background: light-dark(#f3f5f7,#131820); color: light-dark(#172331,#edf2f8); }
  main { max-width: 680px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.65rem; margin: 8px 0; } p { margin: 8px 0; }
  .muted { color: light-dark(#586778,#aab8ca); font-size: .9rem; }
  .card { background: light-dark(white,#1c2531); border: 1px solid light-dark(#dbe2e9,#344152); border-radius: 16px; padding: 22px; margin: 20px 0; }
  .control { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .toggle { width: 54px; height: 30px; accent-color: #087e83; cursor: pointer; flex-shrink: 0; }
  label { font-weight: 650; } dl { display: grid; grid-template-columns: 1fr 1fr; margin: 16px 0 0; }
  dt, dd { margin: 0; padding: 10px 0; border-bottom: 1px solid light-dark(#edf0f4,#344152); }
  dd { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  #error { color: light-dark(#a13116,#ffaf91); } #error:empty { display: none; }
  button, input[type=number] { padding: 8px 12px; border: 1px solid light-dark(#bbc8d5,#56677a); border-radius: 8px; font: inherit; }
  button { cursor: pointer; } button:disabled { cursor: default; opacity: .5; }
  form { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-top: 20px; }
  form label { display: block; } input[type=number] { width: 110px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
</style>
<main>
  <div class="muted">NAS0 / IoT</div>
  <h1>米家石墨烯油汀温控</h1>
  <p class="muted">使用青萍室温调节，仅允许低档加热。</p>
  <section class="card">
    <div class="control">
      <div><label for="automation">自动温控</label><p class="muted">自动开关至少间隔 15 分钟；停用后立即关机。</p></div>
      <input id="automation" class="toggle" type="checkbox" role="switch" disabled>
    </div>
    <form id="settings">
      <div><label for="setpoint">目标温度（°C）</label><input id="setpoint" type="number" min="5" max="30" step="0.1" value="23" required disabled></div>
      <div><label for="tolerance">允许偏差（±°C）</label><input id="tolerance" type="number" min="0.1" max="5" step="0.1" value="1" required disabled></div>
      <button id="save" type="submit" disabled>保存参数</button>
    </form>
    <p class="muted">允许偏差用于评估温控效果，温控始终围绕目标温度调节。</p>
    <dl>
      <dt>青萍室温</dt><dd id="temperature">—</dd>
      <dt>目标区间</dt><dd id="band">—</dd>
      <dt>自动温控</dt><dd id="enabled">正在连接…</dd>
      <dt>调节状态</dt><dd id="reason">—</dd>
      <dt>加热需求</dt><dd id="demand">—</dd>
      <dt>允许自动切换还需</dt><dd id="countdown">—</dd>
      <dt>青萍采集时间</dt><dd id="sensor-updated">—</dd>
    </dl>
    <p id="sensor-freshness" class="muted" role="status"></p>
  </section>
  <section class="card">
    <strong>设备状态与手动操作</strong>
    <dl>
      <dt>设备开关</dt><dd id="power">—</dd>
      <dt>工作状态</dt><dd id="status">—</dd>
      <dt>加热档位</dt><dd id="heat">—</dd>
      <dt>设备故障</dt><dd id="fault">—</dd>
      <dt>最近成功读取</dt><dd id="updated">—</dd>
    </dl>
    <div class="actions"><button id="on" type="button" disabled>手动开启</button><button id="off" type="button" disabled>手动关闭</button></div>
    <p class="muted">手动开关立即执行。自动温控保持启用时，后续仍会自动调节；手动开启也须确认低档。</p>
    <p id="freshness" class="muted" role="status"></p>
  </section>
  <p id="error" role="alert"></p>
  <p id="notice" class="muted" role="status"></p>
  <button id="refresh" type="button">刷新状态</button>
</main>
<script>
  const api = '/iot/heater_ma3/api/';
  const el = id => document.getElementById(id);
  const text = (id, value) => { el(id).textContent = value; };
  const temperature = value => Number.isFinite(value) ? `${value.toFixed(1)} °C` : '—';
  const mapped = (value, names) => value == null ? '—' : (names[value] ?? `未知（${value}）`);
  const date = value => value ? new Date(value * 1000).toLocaleString() : '尚未成功';
  const reasons = {disabled:'已停用', minimum_interval:'等待最短开关间隔', holding_slot:'保持当前加热时段',
    automatic_on:'自动加热', automatic_off:'自动停热', manual:'手动操作', shutdown_pending:'等待关机确认',
    switch_unconfirmed:'开关尚未确认', heater_unavailable:'设备状态不可用', not_low_heat:'等待配置低档',
    device_fault:'设备故障', sensor_stale:'等待有效青萍温度', manual_rejected:'手动开启未执行'};
  let state = null, csrf = null, changing = false, fetching = false, receivedAt = 0, dirty = false;
  function setDisabled(disabled) {
    for (const id of ['automation','setpoint','tolerance','save','on','off']) el(id).disabled = disabled;
    if (!disabled) el('on').disabled = !state?.heater_ok || state.device?.heat_level !== 1 || state.device?.fault !== 0;
  }
  function render(s) {
    state = s; receivedAt = Date.now();
    if (s.csrf) csrf = s.csrf;
    el('automation').checked = s.enabled;
    setDisabled(changing || !csrf);
    if (!dirty) { el('setpoint').value = s.setpoint; el('tolerance').value = s.tolerance; }
    text('enabled', s.enabled ? '已启用' : '已停用');
    text('reason', reasons[s.reason] ?? s.reason);
    text('temperature', temperature(s.temperature));
    text('band', `${(s.setpoint - s.tolerance).toFixed(1)}～${(s.setpoint + s.tolerance).toFixed(1)} °C`);
    text('demand', `${(s.demand * 100).toFixed(1)}%`);
    text('sensor-updated', date(s.sensor_timestamp));
    const d = s.device ?? {};
    text('power', typeof d.power === 'boolean' ? (d.power ? '开启' : '关闭') : '未知');
    text('status', mapped(d.status, {1:'空闲',2:'工作中',3:'延时'}));
    text('heat', mapped(d.heat_level, {0:'正常（不允许自动加热）',1:'低档',2:'高档（不允许自动加热）'}));
    text('fault', d.fault == null ? '未知' : (d.fault === 0 ? '无故障' : `故障代码 ${d.fault}`));
    text('updated', date(s.last_success));
    text('error', s.error ?? '');
    updateClock();
  }
  function updateClock() {
    const since = (Date.now() - receivedAt) / 1000;
    const seconds = state ? Math.max(0, Math.ceil(state.switch_wait_seconds - since)) : null;
    text('countdown', seconds === null ? '—' : (seconds === 0 ? '可按需求切换' : `${Math.floor(seconds/60)} 分 ${seconds%60} 秒`));
    const sensorAge = state?.sensor_age_seconds;
    text('sensor-freshness', !state?.sensor_valid || sensorAge + since > 60 || since > 30 ?
      '青萍读数已过期或尚未有效，请勿视为当前温度。' : `青萍数据有效 · 约 ${Math.max(0, Math.floor(sensorAge + since))} 秒前采集`);
    text('freshness', !state?.heater_ok || since > 30 ? '设备状态未知或已过期，请勿将历史状态视为当前状态。' : '设备状态已确认');
    if (since > 30) setDisabled(true);
  }
  async function request(path, options = {}) {
    const response = await fetch(api + path, {...options, cache:'no-store', signal:AbortSignal.timeout(20000)});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
    return {result, pending:response.status === 202};
  }
  async function refresh() {
    if (fetching || changing) return;
    fetching = true;
    try { const {result} = await request('status'); if (!changing) render(result); }
    catch (error) { if (!changing) { text('error', `无法连接控制服务：${error.message}`); setDisabled(true); } }
    finally { fetching = false; }
  }
  async function change(path, body) {
    if (changing) return;
    changing = true; setDisabled(true); text('notice', '');
    try {
      const {result, pending} = await request(path, {method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':csrf}, body:JSON.stringify(body)});
      if (path === 'settings' && !pending) dirty = false;
      render(result);
      text('notice', pending ? '请求已排队，正在等待执行。' : (result.error ? '' : '操作已处理。'));
    } catch (error) {
      text('error', `操作未确认：${error.message}`);
      if (state) el('automation').checked = state.enabled;
    } finally { changing = false; setDisabled(!csrf || Date.now() - receivedAt > 30000); }
  }
  el('automation').addEventListener('change', () => change('automation', {enabled:el('automation').checked}));
  el('settings').addEventListener('input', () => { dirty = true; });
  el('settings').addEventListener('submit', e => {
    e.preventDefault();
    if (el('settings').reportValidity()) change('settings', {setpoint:Number(el('setpoint').value), tolerance:Number(el('tolerance').value)});
  });
  el('on').addEventListener('click', () => change('power', {power:true}));
  el('off').addEventListener('click', () => change('power', {power:false}));
  el('refresh').addEventListener('click', refresh);
  setInterval(refresh, 5000); setInterval(updateClock, 1000); refresh();
</script>
</html>
