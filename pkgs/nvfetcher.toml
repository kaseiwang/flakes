[smartdns-china-list]
src.git = "https://github.com/felixonmars/dnsmasq-china-list"
fetch.github = "felixonmars/dnsmasq-china-list"

[fcitx5-pinyin-zhwiki]
# Track both the release tag and dated dictionary asset within that release.
src.webpage = "https://api.github.com/repos/felixonmars/fcitx5-pinyin-zhwiki/releases/latest"
src.regex = '"browser_download_url":\s*"https://github\.com/felixonmars/fcitx5-pinyin-zhwiki/releases/download/([^/]+/zhwiki-[0-9]+)\.dict"'
fetch.url = "https://github.com/felixonmars/fcitx5-pinyin-zhwiki/releases/download/$ver.dict"

[xdg-open-server]
src.github_tag = "kitsunyan/xdg-open-server"
fetch.github = "kitsunyan/xdg-open-server"

[vscode-ext-sops]
src.vsmarketplace = "signageos.signageos-vscode-sops"
fetch.vsmarketplace = "signageos.signageos-vscode-sops"
passthru = { publisher = "signageos", name = "signageos-vscode-sops" }

[vscode-ext-ccls]
src.vsmarketplace = "ccls-project.ccls"
fetch.vsmarketplace = "ccls-project.ccls"
passthru = { publisher = "ccls-project", name = "ccls" }

[nvidia_gpu_exporter]
